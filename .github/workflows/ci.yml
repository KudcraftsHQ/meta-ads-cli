name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # The command tree is committed, so it can drift from the SDK without anything
  # failing. This regenerates it and reports when Meta has moved on.
  tree-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the command tree
        run: make tree

      - name: Report drift
        run: |
          if git diff --quiet -- internal/tree/schemas; then
            echo "command tree is current"
          else
            echo "::warning::the committed command tree differs from the current Facebook SDK -- run 'make tree' and commit the result"
            git diff --stat -- internal/tree/schemas
          fi
